deptrac:
  paths:
    - ./app/Core
    - ./app/Platform
    - ./app/Verticals/Montessori
    - ./app/Verticals/School
  exclude_files:
    - '#.*Test\.php#'
  layers:
    - name: Core
      collectors:
        - type: directory
          value: app/Core/.*
    - name: Platform
      collectors:
        - type: directory
          value: app/Platform/.*
    - name: MontessoriVertical
      collectors:
        - type: directory
          value: app/Verticals/Montessori/.*
    - name: SchoolVertical
      collectors:
        - type: directory
          value: app/Verticals/School/.*
  ruleset:
    Core:
      - Core
    Platform:
      - Core
      - Platform
    MontessoriVertical:
      - Core
      - MontessoriVertical
    SchoolVertical:
      - Core
      - SchoolVertical
